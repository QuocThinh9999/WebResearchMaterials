[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "web-research-materials"
version = "1.0.0"
description = "Ứng dụng nội bộ quản lý đề tài và tài liệu nghiên cứu"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2.3,<4",
  "pydantic-settings>=2.6,<3",
  "jinja2>=3.1.4,<4",
  "python-multipart>=0.0.17,<1",
  "pwdlib[argon2]>=0.2.1,<1",
  "itsdangerous>=2.2,<3",
  "httpx>=0.27,<1",
  "truststore>=0.10,<1",
  "PyMuPDF>=1.24,<2",
  "playwright>=1.60,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: kiểm thử cần TEST_DATABASE_URL trỏ tới PostgreSQL dành riêng cho test"]
